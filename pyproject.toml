[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppo-vs-sac"
version = "0.1.0"
description = "PPO vs SAC vs TD3 from scratch: sample efficiency, stability, wall-clock profiling and a multi-task study"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "gymnasium[mujoco]>=1.0",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
